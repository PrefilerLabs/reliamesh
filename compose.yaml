services:
  api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - reliamesh-data:/data
    environment:
      RM_STORE: sqlite
      RM_SQLITE_PATH: /data/reliamesh.db
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
volumes:
  reliamesh-data:

