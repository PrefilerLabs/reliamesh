name: Publish Python packages
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pypi-publish
  cancel-in-progress: false
jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Build release distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          gh run list --workflow ci.yml --commit "$(git rev-parse HEAD)" --status success --json headSha,event,conclusion > /tmp/reliamesh-release-ci.json
          python -c "import json; from pathlib import Path; runs=json.loads(Path('/tmp/reliamesh-release-ci.json').read_text()); assert any(r['event'] == 'push' and r['conclusion'] == 'success' for r in runs), 'Successful main-branch CI is required for this exact release commit'"
          python -m pip install build==1.6.1 setuptools==84.0.0 wheel==0.48.0 twine==7.0.0
          python -c "import os,re,tomllib; from pathlib import Path; tag=os.environ['GITHUB_REF_NAME']; assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+',tag); assert all('v'+tomllib.loads(Path(p).read_text())['project']['version']==tag for p in ('pyproject.toml','sdk/python/pyproject.toml'))"
          python -m build --no-isolation --outdir dist/server .
          python -m build --no-isolation --outdir dist/sdk sdk/python
          python -m twine check --strict dist/server/* dist/sdk/*
          python -m venv /tmp/reliamesh-release-install
          /tmp/reliamesh-release-install/bin/python -m pip install dist/server/*.whl dist/sdk/*.whl
          cd /tmp
          /tmp/reliamesh-release-install/bin/python -c "import importlib.metadata as m; import reliamesh.api,reliamesh_sdk; from reliamesh.storage import SQLiteStore; assert m.version('reliamesh-server') == m.version('reliamesh-sdk'); assert SQLiteStore(':memory:').health(); assert not m.requires('reliamesh-sdk')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/
          retention-days: 14
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: sdk
            environment: pypi
          - package: server
            environment: pypi-server
    environment: ${{ matrix.environment }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
          packages-dir: dist/${{ matrix.package }}/
