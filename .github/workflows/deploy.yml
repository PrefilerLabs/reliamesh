name: Deploy
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Validate release input
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          mkdir -p .local
          python -c "from pathlib import Path; import re; Path('.local/runtime-constraints.txt').write_text('\n'.join(re.findall(r'^([a-zA-Z0-9_.-]+==[^\\\s]+)', Path('requirements.lock').read_text(), re.MULTILINE)) + '\n')"
          python -m pip install -c .local/runtime-constraints.txt pytest==9.1.1 ruff==0.16.8 httpx==0.28.1 packaging==26.3 setuptools==84.0.0 wheel==0.48.0 pip-audit==2.10.1
          python -m pip install --no-deps --no-build-isolation . ./sdk/python
          python -m pip check
          ruff check .
          pytest -q --basetemp=.local/pytest-deploy
          python scripts/check_licenses.py
          pip-audit --require-hashes -r requirements.lock
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/1004383548412/locations/global/workloadIdentityPools/github/providers/reliamesh
          service_account: reliamesh-deploy@reliamesh.iam.gserviceaccount.com
          project_id: reliamesh
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Build and push
        id: image
        env:
          IMAGE: asia-south1-docker.pkg.dev/reliamesh/reliamesh/api
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev --project=reliamesh --quiet
          docker build -t "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"
          DIGEST=$(gcloud artifacts docker images describe "$IMAGE:$GITHUB_SHA" --project=reliamesh --format='value(image_summary.digest)')
          echo "image=$IMAGE@$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Deploy verified image
        shell: pwsh
        env:
          DEPLOY_IMAGE: ${{ steps.image.outputs.image }}
        run: ./infra/deploy.ps1 -Image $env:DEPLOY_IMAGE
