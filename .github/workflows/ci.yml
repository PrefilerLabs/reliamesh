name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked runtime and constrained test tooling
        run: |
          mkdir -p .local
          python -m pip install --require-hashes -r requirements.lock
          python - <<'PY'
          from pathlib import Path
          import re
          entries = [line.rstrip().removesuffix("\\").rstrip() for line in Path("requirements.lock").read_text().splitlines() if re.match(r"^[A-Za-z0-9_.-]+==", line)]
          Path(".local/runtime-constraints.txt").write_text("\n".join(entries) + "\n")
          PY
          python -m pip install -c .local/runtime-constraints.txt pytest==9.1.1 ruff==0.16.8 httpx==0.28.1 build==1.6.1 packaging==26.3 setuptools==84.0.0 wheel==0.48.0
          python -m pip install --no-deps --no-build-isolation . ./sdk/python
          python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Test contracts and integrations
        run: python -m pytest -q --basetemp=.local/pytest-ci
      - name: Check runtime dependency licenses
        run: python scripts/check_licenses.py --json-output .local/runtime-licenses.json
      - name: Build both distributions
        run: |
          python -m build --no-isolation --outdir dist/server .
          python -m build --no-isolation --outdir dist/sdk sdk/python
      - name: Record installed dependency metadata
        run: python -m pip inspect > .local/pip-inspect.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions-and-inventory-py${{ matrix.python }}
          path: |
            dist/
            .local/runtime-licenses.json
            .local/pip-inspect.json
          retention-days: 14

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Audit locked runtime dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --require-hashes -r requirements.lock
      - name: Scan complete Git history for secrets
        run: |
          docker run --rm -v "$PWD:/repo:ro" -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb git /repo --log-opts=--all --redact --no-banner

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build runtime image
        run: docker build --tag reliamesh:ci .
      - name: Verify runtime imports and non-root identity
        run: |
          docker run --rm reliamesh:ci python -c "import os; import reliamesh.api; from reliamesh.storage import SQLiteStore; assert os.getuid() != 0; assert SQLiteStore(':memory:').health()"
